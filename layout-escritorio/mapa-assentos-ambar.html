<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Assentos Âmbar</title>
<!-- SheetJS: leitura e geração de planilhas Excel (precisa de internet só para importar/exportar Excel) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eaeff5;
  --text:#0f1b2a; --muted:#5b6b7f; --faint:#8a99ab;
  --border:#e1e7ef; --border-strong:#c9d3df;
  --brand:#1b536b; --brand-ink:#ffffff; --brand-soft:#e1edf2; --accent:#e67e22;
  --canvas:#ffffff; --grid:rgba(27,83,107,.09); --wall:#1b536b; --arch:#557587; --arch-soft:#edf3f6;
  --seat-empty:#f8fafc; --reserved:#d97706; --danger:#dc2626;
  --shadow:0 1px 2px rgba(15,27,42,.06),0 6px 18px rgba(15,27,42,.07);
  --radius:12px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a111c; --surface:#101a29; --surface-2:#142032; --surface-3:#1b2a40;
  --text:#e6edf5; --muted:#9fb0c3; --faint:#6f8297;
  --border:#22324a; --border-strong:#33465f;
  --brand:#4fa3c4; --brand-ink:#04121a; --brand-soft:#15303d; --accent:#f39c4a;
  --canvas:#0d1624; --grid:rgba(120,170,200,.08); --wall:#5e9ab5; --arch:#86a5b8; --arch-soft:#132232;
  --seat-empty:#101b2b; --reserved:#f59e0b; --danger:#f87171;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;display:flex;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit}
svg.i{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Sidebar ---------- */
.sidebar{width:318px;flex:none;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px;gap:12px;overflow-y:auto;z-index:20}
.sidebar > *{flex:none}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:38px;height:38px;border-radius:11px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand h1{font-size:15.5px;margin:0;letter-spacing:-.01em}
.brand p{margin:0;font-size:12px;color:var(--muted)}
.site-switch{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-3);padding:4px;border-radius:11px;gap:4px}
.site-switch button{border:0;background:transparent;padding:7px 6px;border-radius:8px;font-weight:650;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.2}
.site-switch button small{font-weight:500;font-size:11px;color:var(--faint)}
.site-switch button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.card h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.occ-big{display:flex;align-items:baseline;gap:6px}
.occ-big b{font-size:28px;letter-spacing:-.02em;line-height:1}
.occ-big span{color:var(--muted);font-size:13px}
.occ-big em{margin-left:auto;font-style:normal;font-weight:700;color:var(--brand)}
.bar{height:8px;background:var(--surface-3);border-radius:99px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.chip b{color:var(--text)}
.chip.warn{border-color:color-mix(in srgb,var(--reserved) 45%,transparent)} .chip.warn b{color:var(--reserved)}
.chip.aq b{color:var(--danger)}
.site-total{margin-top:8px;font-size:12px;color:var(--muted)}
.site-total b{color:var(--text)}
#areaList{max-height:168px;overflow:auto;margin-right:-6px;padding-right:6px}
.area-row{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;font-size:12.5px;padding:3px 0;cursor:pointer;border-radius:6px}
.area-row:hover .lbl{color:var(--brand)}
.area-row .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.area-row b{font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.muted-txt{color:var(--faint);font-size:12px}
.sidebar > .grow{flex:1 0 auto;min-height:260px;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.card-head h3{margin:0}
.count{background:var(--surface-3);color:var(--muted);border-radius:99px;padding:0 7px;font-size:11px;letter-spacing:0}
.add-form{display:grid;gap:6px;margin-bottom:10px;padding:10px;border-radius:10px;background:var(--surface);border:1px solid var(--border)}
.add-form .row{display:flex;gap:6px}
.pool-filters{display:grid;grid-template-columns:1fr 112px;gap:6px;margin-bottom:8px}
.pool-list{flex:1;overflow:auto;margin:0 -6px;padding:2px 6px;min-height:70px;border-radius:9px}
.pool-list.drop-over{outline:2px dashed var(--brand);outline-offset:-2px;background:var(--brand-soft)}
.person{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;background:var(--surface);border:1px solid var(--border);margin-bottom:6px;cursor:grab;position:relative}
.person:hover{border-color:var(--border-strong)}
.person.selected{outline:2px solid var(--accent);outline-offset:-1px}
.person .who{flex:1;min-width:0}
.person .nm{font-weight:650;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.person .acts{display:none;gap:2px}
.person:hover .acts{display:flex}
.mini-tag{font-size:9px;font-weight:800;padding:0 4px;border-radius:4px;background:var(--danger);color:#fff;margin-left:5px;vertical-align:1px}
.mini-tag.sub{background:var(--reserved)}
.empty-state{font-size:12.5px;color:var(--faint);text-align:center;padding:18px 8px;line-height:1.5}
.empty-state .btn{margin-top:8px}
.hint{font-size:11.5px;color:var(--faint);margin:8px 0 0;line-height:1.4}
.side-foot{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;padding:0 2px}
.side-foot .warn{color:var(--reserved);font-weight:600}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:650;cursor:pointer;padding:0;font-size:inherit}

/* ---------- Controles ---------- */
.input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;min-width:0}
.input:focus{outline:2px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:0;border-color:var(--brand)}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:650;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-3)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.danger-fill{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;flex:none}
.icon-btn:hover{background:var(--surface-3)}
.icon-btn:disabled{opacity:.4;cursor:default}
.icon-btn.sm{width:26px;height:26px;border-radius:6px;border-color:transparent;background:transparent;color:var(--muted)}
.icon-btn.sm:hover{background:var(--surface-3);color:var(--text)}
.icon-btn.sm svg.i{width:14px;height:14px}

/* ---------- Área principal ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--surface);flex-wrap:wrap}
.titles{min-width:0}
.titles .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.titles h2{margin:0;font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.titles h2 small{font-size:13px;color:var(--muted);font-weight:500}
.search{position:relative;margin-left:auto;width:min(330px,38vw)}
.search .input{padding-left:34px;height:36px}
.search .s-ico{position:absolute;left:11px;top:10px;color:var(--faint);display:flex;pointer-events:none}
.search .s-ico svg.i{width:16px;height:16px}
.kbd{position:absolute;right:9px;top:8px;font-size:11px;color:var(--faint);border:1px solid var(--border);border-radius:5px;padding:0 6px;background:var(--surface-2)}
.results{position:absolute;top:calc(100% + 6px);right:0;width:max(100%,460px);max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);max-height:380px;overflow:auto;z-index:60;display:none;padding:4px}
.results.open{display:block}
.result{display:flex;gap:9px;align-items:center;padding:8px 9px;cursor:pointer;border-radius:8px}
.result:hover,.result.active{background:var(--surface-3)}
.result .nm{font-weight:650;font-size:13px}
.result .sub{font-size:11px;color:var(--muted)}
.result .loc{margin-left:auto;max-width:60%;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.result .loc.none{color:var(--reserved);font-weight:600}
.tools{display:flex;gap:6px;align-items:center}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow);padding:6px;min-width:260px;z-index:70;display:none}
.menu-pop.open{display:block}
.menu-pop button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:transparent;color:var(--text);padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer;text-align:left}
.menu-pop button:hover{background:var(--surface-3)}
.menu-pop button small{display:block;color:var(--muted);font-size:11px}
.menu-pop hr{border:0;border-top:1px solid var(--border);margin:5px 0}
.menu-pop .danger{color:var(--danger)}
.floor-tabs{display:flex;gap:2px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto}
.tab{border:0;background:transparent;padding:9px 13px 11px;font-weight:650;font-size:13px;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-bottom-color:var(--brand)}
.tab .cnt{font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--surface-3);color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .cnt{background:var(--brand-soft);color:var(--brand)}
.stage{flex:1;overflow:auto;display:flex;padding:24px;position:relative}
.sizer{margin:auto;position:relative;flex:none}
.plan{position:absolute;left:4px;top:4px;transform-origin:0 0}
.bottombar{display:flex;align-items:center;gap:12px;padding:8px 20px;background:var(--surface);border-top:1px solid var(--border)}
.legend{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);cursor:pointer;color:var(--text)}
.lg:hover{border-color:var(--border-strong)}
.lg.on{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.lg.off{opacity:.45}
.lg .n{color:var(--muted);font-variant-numeric:tabular-nums}
.lg.static{cursor:default}
.dot.free{background:var(--seat-empty);border:1.5px dashed var(--border-strong)}
.dot.res{background:color-mix(in srgb,var(--reserved) 18%,var(--surface));border:1.5px solid var(--reserved)}
.zoom{display:flex;align-items:center;gap:4px}
.zoom span{min-width:46px;text-align:center;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}

/* ---------- Planta ---------- */
.plan-canvas{position:relative;background-color:var(--canvas);background-image:radial-gradient(var(--grid) 1.1px,transparent 1.2px);background-size:18px 18px;outline:3px solid var(--wall);border-radius:5px;box-shadow:var(--shadow)}
.abs{position:absolute}
.stair{border:2px solid var(--arch);border-top:0;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(90deg,transparent 0 15px,color-mix(in srgb,var(--arch) 30%,transparent) 15px 17px),var(--arch-soft)}
.stair span{background:var(--canvas);padding:3px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--arch);border:1.5px solid var(--arch);text-transform:uppercase}
.door{display:inline-flex;gap:6px;align-items:center;padding:5px 11px 5px 9px;border:1.5px solid var(--arch);border-radius:99px;font-size:10.5px;font-weight:700;color:var(--arch);background:var(--canvas);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.door svg.i{width:14px;height:14px}
.entrance{background:var(--accent);border-radius:3px}
.entrance-lbl{font-size:11px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:4px}
.wall-line{background:var(--wall);border-radius:2px}
.note{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--arch);text-align:center;text-transform:uppercase}
.room{border:2px solid var(--arch);border-radius:14px;background:color-mix(in srgb,var(--arch-soft) 75%,transparent)}
.room-label{position:absolute;top:9px;left:0;right:0;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--arch)}
.caption{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.tbl{display:flex;border-radius:8px;overflow:hidden;box-shadow:0 2px 6px rgba(15,27,42,.14)}
.tbl .seg{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;font-size:13px;padding:0 8px;background:var(--c);color:var(--on);position:relative;line-height:1.15;min-width:0}
.tbl .seg + .seg{box-shadow:inset 2px 0 0 rgba(255,255,255,.6)}
.editable{cursor:text}
.editable:hover{filter:brightness(1.07)}
.editable:hover::after{content:"✎";position:absolute;top:3px;right:6px;font-size:11px;opacity:.85}
.desk{background:var(--surface-3);border:1px solid var(--border-strong);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:650;color:var(--faint)}
.desk.ghost{background:transparent;border-style:dashed}
.droom{border:2px dashed color-mix(in srgb,var(--arch) 55%,transparent);border-radius:13px;background:color-mix(in srgb,var(--arch-soft) 65%,transparent)}
.dcore{background:var(--wall);color:var(--canvas);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;padding:0 8px;text-align:center;position:absolute}
.visitor{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong);background:var(--surface)}

.seat{position:absolute;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 6px 3px 9px;font-size:11.5px;line-height:1.15;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .12s,box-shadow .12s,opacity .15s;overflow:hidden}
.seat .nm{font-weight:650;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.seat.occ{background:color-mix(in srgb,var(--c) 16%,var(--canvas));border:1px solid color-mix(in srgb,var(--c) 50%,transparent);color:var(--text);box-shadow:0 1px 2px rgba(15,27,42,.07)}
.seat.occ::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.seat.empty{background:var(--seat-empty);border:1.5px dashed color-mix(in srgb,var(--c,#94a3b8) 45%,var(--border-strong));color:var(--faint)}
.seat.empty .nm{font-weight:500}
.seat.reserved{border:1.5px solid var(--reserved);background:color-mix(in srgb,var(--reserved) 10%,var(--canvas));color:var(--text)}
.seat.reserved small{display:block;font-size:8.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--reserved);font-weight:800}
.seat .tag{position:absolute;top:2px;right:3px;font-size:8px;font-weight:800;padding:0 3px;border-radius:3px;background:var(--danger);color:#fff;line-height:1.4}
.seat .tag.sub{background:var(--reserved)}
.seat:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(15,27,42,.18);z-index:5}
.seat.dim{opacity:.2}
.seat.hit{box-shadow:0 0 0 3px var(--accent),0 6px 16px rgba(0,0,0,.18);z-index:6}
.seat.flash{animation:flash 1.1s ease 3;z-index:7}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 var(--accent)}50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--accent) 45%,transparent)}}
.seat.drop-over{box-shadow:0 0 0 3px var(--brand);transform:scale(1.06);z-index:8}
.seat.dragging{opacity:.35}
body.placing .seat.empty{border:1.5px solid var(--accent);animation:breathe 1.6s infinite}
body.placing .seat.occ{cursor:alias}
@keyframes breathe{50%{background:color-mix(in srgb,var(--accent) 16%,var(--canvas))}}

/* ---------- Tooltip, modal, toast ---------- */
.tip{position:fixed;z-index:200;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);border-radius:11px;padding:10px 12px;font-size:12.5px;pointer-events:none;max-width:270px}
.tip b{display:block;font-size:13.5px}
.tip .meta{color:var(--muted);margin-top:2px}
.tip .pill{display:inline-flex;gap:6px;align-items:center;margin-top:7px;font-size:11.5px;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(8,14,24,.48);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal[hidden]{display:none}
.dialog{background:var(--surface);color:var(--text);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.32);width:min(470px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;border:1px solid var(--border)}
.dialog.wide{width:min(620px,100%)}
.dlg-head{padding:18px 20px 6px;display:flex;align-items:flex-start;gap:10px}
.dlg-head h3{margin:0;font-size:16.5px;letter-spacing:-.01em}
.dlg-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
.dlg-head .icon-btn{margin-left:auto;border-color:transparent}
.dlg-body{padding:10px 20px 12px;overflow:auto}
.dlg-body p{margin:0 0 8px}
.dlg-foot{padding:10px 20px 18px;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{display:block;margin-bottom:10px}
.field > span{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:8px;cursor:pointer}
.pick-list{max-height:250px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:4px;margin-top:8px}
.pick{display:flex;gap:9px;align-items:center;padding:7px 8px;border-radius:7px;cursor:pointer}
.pick:hover{background:var(--surface-3)}
.pick .who{min-width:0;flex:1}
.pick .nm{font-weight:650;font-size:13px}
.pick .sub{font-size:11px;color:var(--muted)}
.pick .loc{font-size:11px;color:var(--muted);text-align:right}
.dlg-tabs{display:flex;gap:4px;background:var(--surface-3);padding:3px;border-radius:9px;margin-bottom:12px}
.dlg-tabs button{flex:1;border:0;background:transparent;padding:7px;border-radius:7px;font-size:12.5px;font-weight:650;color:var(--muted);cursor:pointer}
.dlg-tabs button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.person-head{display:flex;gap:12px;align-items:center;padding:11px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 32%,transparent);margin-bottom:14px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--c);color:var(--on);display:grid;place-items:center;font-weight:800;flex:none}
.person-head .nm{font-weight:700;font-size:15px}
.person-head .sub{font-size:12px;color:var(--muted)}
.area-edit{display:grid;grid-template-columns:36px 1fr 130px 30px;gap:6px;align-items:center;margin-bottom:6px}
.area-edit input[type=color]{width:36px;height:34px;border:1px solid var(--border-strong);border-radius:8px;padding:2px;background:var(--surface);cursor:pointer}
.area-group-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:12px 0 6px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.kv kbd{font:600 11.5px/1.6 inherit;border:1px solid var(--border-strong);border-bottom-width:2px;border-radius:5px;padding:0 6px;background:var(--surface-2);white-space:nowrap}
.import-sum{display:grid;gap:6px;margin:4px 0 0}
.import-sum div{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border)}
.toast{position:fixed;bottom:66px;left:50%;transform:translate(-50%,16px);background:#0f1b2a;color:#fff;padding:10px 14px;border-radius:11px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:300;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:transparent;border:0;color:#7dd3fc;font-weight:700;cursor:pointer;padding:0}
.placing-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 8px 8px 16px;border-radius:99px;font-weight:650;font-size:13px;z-index:150;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px)}
.placing-bar[hidden]{display:none}
.placing-bar button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:99px;padding:5px 12px;font-weight:700;cursor:pointer}
#printArea{display:none}
.only-mobile{display:none!important}

@media (max-width:920px){
  .sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);z-index:120}
  .sidebar.open{transform:none}
  .only-mobile{display:inline-grid!important}
  .topbar{padding:10px 16px;gap:10px}
  .search{order:5;width:100%;margin-left:0}
  .tools{margin-left:auto}
  .floor-tabs,.bottombar{padding-left:16px;padding-right:16px}
  .stage{padding:16px}
  .hide-sm{display:none!important}
  .bottombar{flex-wrap:wrap}
}

/* ---------- Impressão ---------- */
.print-page{padding:0}
.print-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #1b536b;padding-bottom:6px;margin-bottom:12px;gap:20px}
.print-head h1{font-size:20px;margin:0;color:#0f1b2a}
.print-head p{margin:0;font-size:11px;color:#555}
.print-head .r{text-align:right}
.print-plan{position:relative}
.print-inner{position:absolute;left:4px;top:4px;transform-origin:0 0}
.print-legend{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:14px;font-size:10.5px;color:#333}
.print-legend span{display:inline-flex;gap:5px;align-items:center}
@media print{
  @page{size:A4 landscape;margin:10mm}
  :root,:root[data-theme]{
    --bg:#fff; --surface:#fff; --surface-2:#f6f8fb; --surface-3:#eaeff5; --text:#0f1b2a; --muted:#5b6b7f; --faint:#8a99ab;
    --border:#e1e7ef; --border-strong:#c9d3df; --brand:#1b536b; --canvas:#fff; --grid:transparent; --wall:#1b536b;
    --arch:#557587; --arch-soft:#edf3f6; --seat-empty:#fff; --reserved:#d97706; --shadow:none; color-scheme:light;
  }
  html,body{height:auto;overflow:visible;background:#fff;display:block}
  body > *:not(#printArea){display:none!important}
  #printArea{display:block}
  .print-page{break-after:page;page-break-after:always}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <div class="logo" data-icon="grid"></div>
    <div><h1>Mapa de Assentos</h1><p>Âmbar · Bloco 6 e Matriz</p></div>
  </div>
  <div class="site-switch" id="siteSwitch"></div>
  <section class="card" id="occCard"></section>
  <section class="card"><h3>Por área neste andar</h3><div id="areaList"></div></section>
  <section class="card grow">
    <div class="card-head">
      <h3>Não alocados <span class="count" id="poolCount">0</span></h3>
      <button class="icon-btn sm" id="btnAddPerson" title="Adicionar pessoa" data-icon="plus"></button>
    </div>
    <form class="add-form" id="addForm" hidden autocomplete="off">
      <input class="input" id="addName" placeholder="Nome do colaborador" required>
      <input class="input" id="addRole" placeholder="Cargo (opcional)">
      <select class="input" id="addArea"></select>
      <div class="row"><button type="button" class="btn sm ghost" id="addCancel">Fechar</button><button class="btn sm primary" style="flex:1">Adicionar à lista</button></div>
    </form>
    <div class="pool-filters">
      <input class="input" id="poolSearch" placeholder="Filtrar lista…">
      <select class="input" id="poolArea"></select>
    </div>
    <div class="pool-list" id="poolList"></div>
    <p class="hint">Arraste a pessoa até um lugar, ou clique nela e depois no lugar. Arraste alguém da planta para cá para desocupar.</p>
  </section>
  <footer class="side-foot"><span id="saveStatus"></span><span id="backupInfo"></span></footer>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="btnSidebar" title="Painel" data-icon="menu"></button>
    <div class="titles"><div class="eyebrow" id="siteTitle"></div><h2 id="floorTitle"></h2></div>
    <div class="search">
      <span class="s-ico" data-icon="search"></span>
      <input class="input" id="search" placeholder="Buscar pessoa, cargo ou área…" autocomplete="off">
      <span class="kbd hide-sm" id="searchKbd">/</span>
      <div class="results" id="results"></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="btnUndo" title="Desfazer (Ctrl+Z)" data-icon="undo"></button>
      <div class="menu">
        <button class="btn" data-menu="mImport"><span data-icon="upload"></span><span class="hide-sm">Importar</span></button>
        <div class="menu-pop" id="mImport">
          <button data-act="importExcel"><span data-icon="sheet"></span><span>Planilha Excel / CSV<small>Nome, Cargo, Área (e Código do lugar, se houver)</small></span></button>
          <button data-act="importJson"><span data-icon="archive"></span><span>Backup ou layout antigo (.json)<small>Também aceita o JSON exportado da versão anterior da Matriz</small></span></button>
        </div>
      </div>
      <div class="menu">
        <button class="btn" data-menu="mExport"><span data-icon="download"></span><span class="hide-sm">Exportar</span></button>
        <div class="menu-pop" id="mExport">
          <button data-act="exportExcel"><span data-icon="sheet"></span><span>Planilha Excel<small>Todos os lugares, não alocados e resumo</small></span></button>
          <button data-act="exportBackup"><span data-icon="archive"></span><span>Backup completo (.json)<small>Guarde para restaurar depois</small></span></button>
          <hr>
          <button data-act="printFloor"><span data-icon="printer"></span><span>Imprimir este andar<small>A4 paisagem, com legenda</small></span></button>
          <button data-act="printSite"><span data-icon="printer"></span><span>Imprimir todos os andares da sede</span></button>
        </div>
      </div>
      <div class="menu">
        <button class="icon-btn" data-menu="mMore" title="Mais opções" data-icon="more"></button>
        <div class="menu-pop" id="mMore">
          <button data-act="areas"><span data-icon="tag"></span>Áreas e cores…</button>
          <button data-act="theme"><span data-icon="moon"></span>Alternar tema claro/escuro</button>
          <button data-act="help"><span data-icon="help"></span>Atalhos e dicas</button>
          <hr>
          <button data-act="clearFloor"><span data-icon="eraser"></span>Esvaziar este andar</button>
          <button data-act="reset" class="danger"><span data-icon="reset"></span>Restaurar dados iniciais</button>
        </div>
      </div>
    </div>
  </header>
  <nav class="floor-tabs" id="floorTabs"></nav>
  <div class="stage" id="stage"><div class="sizer" id="sizer"><div class="plan" id="plan"></div></div></div>
  <div class="bottombar">
    <div class="legend" id="legend"></div>
    <div class="zoom">
      <button class="icon-btn sm" id="zoomOut" title="Diminuir zoom" data-icon="minus"></button>
      <span id="zoomVal">100%</span>
      <button class="icon-btn sm" id="zoomIn" title="Aumentar zoom" data-icon="plus"></button>
      <button class="icon-btn sm" id="zoomFit" title="Ajustar à tela" data-icon="fit"></button>
    </div>
  </div>
</main>

<div class="placing-bar" id="placingBar" hidden><span id="placingText"></span><button id="placingCancel">Cancelar</button></div>
<div class="tip" id="tip" hidden></div>
<div class="modal" id="modal" hidden>
  <div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dlg-head"><div><h3 id="dlgTitle"></h3><p id="dlgSub"></p></div><button class="icon-btn" id="dlgClose" title="Fechar" data-icon="x"></button></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot" id="dlgFoot"></div>
  </div>
</div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastAct" hidden></button></div>
<div id="printArea"></div>
<input type="file" id="fileExcel" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>

let state;

function seedState() {
  const s = { version: 1, areas: clone(DEFAULT_AREAS), people: {}, assign: {}, reserve: {}, labels: {}, lastBackup: null };
  for (const [fid, tables] of Object.entries(SEED_B6)) for (const [tid, sides] of Object.entries(tables)) for (const side of ['t', 'b']) {
    (sides[side] || []).forEach((v, i) => {

      if (v.r) { s.reserve[seat] = v.r; return; }
      const id = uid() + i + side;

}
function migrate(s) {

  if (!s.areas['sem-area']) s.areas['sem-area'] = clone(DEFAULT_AREAS['sem-area']);
  if (!Object.keys(s.areas).length) s.areas = clone(DEFAULT_AREAS);
  for (const p of Object.values(s.people)) if (!s.areas[p.area]) p.area = 'sem-area';
  for (const [seat, pid] of Object.entries(s.assign)) if (!SEATS[seat] || !s.people[pid]) delete s.assign[seat];

}
function loadState() {

  } catch (e) { /* armazenamento indisponível */ }
  return seedState();
}

  catch (e) { saveOk = false; }

}

}

function placePerson(pid, seatId) {
  const p = state.people[pid]; if (!p || !SEATS[seatId]) return;
  const from = seatOf(pid);
  if (from === seatId) return;
  const prev = state.assign[seatId];
  snapshot();
  if (from) delete state.assign[from];
  if (prev && from) state.assign[from] = prev;          // vindo de outro lugar: troca
  state.assign[seatId] = pid;
  delete state.reserve[seatId];
  ui.lastArea = p.area;
  let msg;
  if (prev && from) msg = `${p.name} e ${state.people[prev].name} trocaram de lugar`;
  else if (prev) msg = `${p.name} entrou no lugar · ${state.people[prev].name} voltou para a lista`;
  else msg = `${p.name} → ${seatLabel(SEATS[seatId])}`;
  commit(msg);
}

  snapshot(); delete state.assign[seatId];
  commit(`${state.people[pid].name} voltou para a lista de não alocados`);
}

  const p = state.people[pid]; if (!p) return;

}

  snapshot();

  ui.lastArea = a;
  if (seatId) { state.assign[seatId] = id; delete state.reserve[seatId]; }
  commit(seatId ? `${name} → ${seatLabel(SEATS[seatId])}` : `${name} adicionado(a) à lista`);

}

function floorStats(floor) {

    else if (state.reserve[s.id]) res++;

  const total = floor.seats.length;

function areaOptions(selected, prefer, withAll) {
  const order = [prefer, ...Object.keys(GROUPS).filter(g => g !== prefer)];
  let h = withAll ? `<option value="ALL">Todas as áreas</option>` : '';
  for (const g of order) {
    const items = Object.entries(state.areas).filter(([, a]) => (a.group || 'geral') === g).sort((a, b) => cmp(a[1].label, b[1].label));
    if (!items.length) continue;
    h += `<optgroup label="${GROUPS[g] || g}">` + items.map(([k, a]) => `<option value="${k}" ${k === selected ? 'selected' : ''}>${esc(a.label)}</option>`).join('') + '</optgroup>';
  }

function applyHighlights() {

    let hit = false, dim = false;
    if (q) { hit = !!p && matchPerson(p, q); dim = !hit; }
    else if (fa) dim = (p ? p.area : SEATS[sid].area) !== fa;
    e.classList.toggle('hit', hit); e.classList.toggle('dim', dim);
  });
}
function gotoFloor(fid) {
  if (!FLOORS[fid]) return;
  ui.floor = fid; ui.site = FLOORS[fid].site.id; ui.focusArea = null;
  if (ui.zoom !== 'fit') ui.zoom = 'fit';
  render(); $('#stage').scrollTo(0, 0);
}
function gotoSeat(seatId) {
  const s = SEATS[seatId]; if (!s) return;
  if (ui.floor !== s.floor.id) gotoFloor(s.floor.id);
  requestAnimationFrame(() => {
    const e = $(`#plan [data-seat="${seatId}"]`), st = $('#stage'), sz = $('#sizer');
    if (!e) return;
    st.scrollTo({ left: sz.offsetLeft + 4 + (s.x + SW / 2) * ui.z - st.clientWidth / 2, top: sz.offsetTop + 4 + (s.y + SH / 2) * ui.z - st.clientHeight / 2, behavior: 'smooth' });

let resultIdx = 0, resultItems = [];
function renderResults() {
  const q = norm(ui.search), box = $('#results');
  if (!q) { box.classList.remove('open'); box.innerHTML = ''; resultItems = []; return; }
  const seatByPid = {}; for (const [s, p] of Object.entries(state.assign)) seatByPid[p] = s;
  resultItems = Object.values(state.people).filter(p => matchPerson(p, q))
    .sort((a, b) => (norm(a.name).startsWith(q) ? 0 : 1) - (norm(b.name).startsWith(q) ? 0 : 1) || cmp(a.name, b.name))

function openDialog({ title, subtitle, body, actions = [], wide = false }) {
  $('#dlgTitle').textContent = title;
  $('#dlgSub').textContent = subtitle || ''; $('#dlgSub').hidden = !subtitle;
  const b = $('#dlgBody'); b.innerHTML = '';
  if (typeof body === 'string') b.innerHTML = body; else if (body) b.append(body);
  const f = $('#dlgFoot'); f.innerHTML = '';
  actions.forEach(a => {
    const btn = el('button', 'btn ' + (a.kind || ''), (a.icon ? icon(a.icon) : '') + esc(a.label));
    if (a.left) btn.style.marginRight = 'auto';
    btn.onclick = () => a.onClick?.(b);
    f.append(btn);
  });
  f.hidden = !actions.length;
  $('#dialog').classList.toggle('wide', wide);
  $('#modal').hidden = false; hideTip();
  setTimeout(() => b.querySelector('[autofocus]')?.focus(), 40);
  return b;
}
function closeDialog() { $('#modal').hidden = true; }
function confirmDialog(title, msg, okLabel = 'Confirmar', danger = false) {
  return new Promise(res => openDialog({ title, body: `<p>${esc(msg)}</p>`, actions: [
    { label: 'Cancelar', onClick: () => { closeDialog(); res(false); } },
    { label: okLabel, kind: danger ? 'danger-fill' : 'primary', onClick: () => { closeDialog(); res(true); } },
  ] }));
}
function textDialog(title, value, placeholder, onSave, extraAction) {
  const actions = [];
  if (extraAction) actions.push(extraAction);
  actions.push({ label: 'Cancelar', onClick: closeDialog }, { label: 'Salvar', kind: 'primary', onClick: b => { onSave($('input', b).value.trim()); closeDialog(); } });
  const b = openDialog({ title, body: `<input class="input" autofocus value="${esc(value)}" placeholder="${esc(placeholder || '')}">`, actions });
  $('input', b).addEventListener('keydown', e => { if (e.key === 'Enter') { onSave(e.target.value.trim()); closeDialog(); } });
}

function personFields(p, prefer) {
  return `<label class="field"><span>Nome</span><input class="input" name="name" value="${esc(p.name || '')}" autofocus required></label>
    <div class="row2"><label class="field"><span>Cargo</span><input class="input" name="role" value="${esc(p.role || '')}" placeholder="Opcional"></label>
    <label class="field"><span>Área / líder</span><select class="input" name="area">${areaOptions(p.area, prefer)}</select></label></div>`;
}
const readPerson = b => ({ name: $('[name=name]', b).value.trim(), role: $('[name=role]', b).value.trim(), area: $('[name=area]', b).value });

function openPersonDialog(pid) {
  const p = state.people[pid]; if (!p) return;
  const sid = seatOf(pid), s = sid && SEATS[sid], a = area(p.area);
  const body = `<div class="person-head" style="--c:${a.color};--on:${onColor(a.color)}"><div class="avatar">${esc(initials(p.name))}</div>
      <div><div class="nm">${esc(p.name)}</div><div class="sub">${s ? esc(seatWhere(s)) + ' · ' + esc(seatLabel(s)) : 'Sem lugar definido'}</div></div></div>
    ${personFields(p, s ? s.floor.site.id : ui.site)}`;
  const actions = [
    { label: 'Excluir', kind: 'danger ghost', icon: 'trash', left: true, onClick: async () => { closeDialog(); if (await confirmDialog('Excluir pessoa', `Remover ${p.name} do cadastro? (É possível desfazer.)`, 'Excluir', true)) deletePerson(pid); } },
  ];
  if (s) {
    actions.push({ label: 'Desocupar', onClick: () => { closeDialog(); unassignSeat(sid); } });

function onSeatClick(seatId) {

function openAreasDialog() {
  const work = Object.entries(state.areas).map(([k, a]) => ({ key: k, ...clone(a) }));
  const wrap = el('div');
  const draw = () => {
    let h = '<p class="muted-txt">Altere nomes e cores. Áreas removidas passam seus colaboradores para “Sem área definida”.</p>';

      if (!rows.length) continue;
      h += `<div class="area-group-title">${GROUPS[g]}</div>`;
      h += rows.map(a => `<div class="area-edit" data-key="${esc(a.key)}">

        <select class="input" data-f="group">${Object.entries(GROUPS).map(([gk, gl]) => `<option value="${gk}" ${gk === (a.group || 'geral') ? 'selected' : ''}>${gl}</option>`).join('')}</select>

  });

  wrap.addEventListener('click', e => {
    if (e.target.closest('#areaAdd')) { const key = 'a-' + Math.random().toString(36).slice(2, 8); work.push({ key, label: 'Nova área', color: '#0ea5e9', group: ui.site, kw: [] }); draw(); $(`[data-key="${key}"] [data-f=label]`, wrap)?.select(); return; }

  });

  openDialog({ title: 'Áreas e cores', body: wrap, wide: true, actions: [
    { label: 'Cancelar', onClick: closeDialog },
    { label: 'Salvar', kind: 'primary', onClick: () => {
      snapshot();
      const next = {};

function showTip(seatEl) {
  const sid = seatEl.dataset.seat, s = SEATS[sid], p = state.people[state.assign[sid]], tip = $('#tip');
  if (p) {
    const a = area(p.area);
    tip.innerHTML = `<b>${esc(p.name)}</b>${p.role ? `<div class="meta">${esc(p.role)}</div>` : ''}<div class="meta">${esc(seatLabel(s))}</div><div class="pill" style="--c:${a.color}"><span class="dot"></span>${esc(a.label)}</div>`;
  } else {
    const r = state.reserve[sid];
    tip.innerHTML = `<b>${r ? 'Reservado: ' + esc(r) : 'Lugar livre'}</b><div class="meta">${esc(seatLabel(s))}</div>${s.area ? `<div class="pill" style="--c:${area(s.area).color}"><span class="dot"></span>Mesa de ${esc(area(s.area).label)}</div>` : ''}<div class="meta" style="margin-top:6px">Clique para alocar alguém</div>`;
  }
  tip.hidden = false;
  const r = seatEl.getBoundingClientRect(), tr = tip.getBoundingClientRect();
  let x = r.left + r.width / 2 - tr.width / 2, y = r.top - tr.height - 10;
  if (y < 8) y = r.bottom + 10;
  x = Math.max(8, Math.min(window.innerWidth - tr.width - 8, x));
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { $('#tip').hidden = true; }
let toastTimer;
function toast(msg, action) {
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  const b = $('#toastAct');
  if (action) { b.hidden = false; b.textContent = action.label; b.onclick = () => { t.classList.remove('show'); action.fn(); }; } else b.hidden = true;
  t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), action ? 5000 : 3000);
}

/* =====================================================================
   EXCEL E BACKUP
   ===================================================================== */
function needXLSX() { if (window.XLSX) return true; toast('A biblioteca de Excel não carregou. Verifique a conexão com a internet e recarregue a página.'); return false; }
function sheet(rows, widths) { const ws = XLSX.utils.json_to_sheet(rows); ws['!cols'] = widths.map(w => ({ wch: w })); return ws; }
function exportExcel() {
  if (!needXLSX()) return;
  const all = [], summary = [];
  for (const site of SITES) for (const f of site.floors) {
    const st = floorStats(f);
    summary.push({ 'Sede': site.name, 'Andar': f.name, 'Lugares': st.total, 'Ocupados': st.occ, 'Livres': st.free, 'Reservados': st.res, '% Ocupação': st.total ? Math.round(st.occ / st.total * 100) + '%' : '-' });
    for (const s of f.seats) {
      const p = state.people[state.assign[s.id]];
      all.push({ 'Sede': site.name, 'Andar': f.name, 'Mesa / Sala': s.item.type === 'bench' ? `Bancada ${s.item.n}` : itemLabel(f, s.item), 'Lugar': seatLabel(s), 'Código do lugar': s.id,
        'Situação': p ? 'Ocupado' : state.reserve[s.id] ? 'Reservado' : 'Livre', 'Nome': p?.name || '', 'Cargo': p?.role || '', 'Área / Líder': p ? area(p.area).label : '', 'Reserva': state.reserve[s.id] || '' });
    }
  }
  const assigned = assignedSet();
  const pool = Object.values(state.people).filter(p => !assigned.has(p.id)).sort((a, b) => cmp(area(a.area).label, area(b.area).label) || cmp(a.name, b.name))
    .map(p => ({ 'Nome': p.name, 'Cargo': p.role || '', 'Área / Líder': area(p.area).label }));
  const byArea = Object.entries(state.areas).map(([k, a]) => {
    const ppl = Object.values(state.people).filter(p => p.area === k);
    return { 'Área / Líder': a.label, 'Grupo': GROUPS[a.group] || '', 'Pessoas': ppl.length, 'Com lugar': ppl.filter(p => assigned.has(p.id)).length, 'Sem lugar': ppl.filter(p => !assigned.has(p.id)).length };
  }).filter(r => r['Pessoas'] > 0);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, sheet(all, [10, 18, 30, 46, 18, 11, 24, 22, 30, 20]), 'Alocação');
  XLSX.utils.book_append_sheet(wb, sheet(pool.length ? pool : [{ 'Nome': '', 'Cargo': '', 'Área / Líder': '' }], [28, 24, 32]), 'Não alocados');
  const ws = sheet(summary, [10, 20, 10, 10, 10, 11, 12]);
  XLSX.utils.sheet_add_json(ws, byArea, { origin: summary.length + 3 });
  XLSX.utils.book_append_sheet(wb, ws, 'Resumo');
  XLSX.writeFile(wb, `Mapa_Assentos_Ambar_${dateStamp()}.xlsx`);
  toast('Planilha exportada');
}
function matchArea(raw) {
  const s = norm(raw); if (!s) return null;
  let best = null, bestScore = 0;
  for (const [k, a] of Object.entries(state.areas)) {
    let score = 0;
    const lab = norm(a.label), base = norm(a.label.replace(/\s*\(.*\)/, ''));
    if (s === norm(k) || s === lab || s === base) score = 1000;
    else {
      for (const kw of [...(a.kw || []), base]) {
        const nk = norm(kw); if (!nk) continue;
        const hit = nk.length <= 3 ? new RegExp(`(^|[^a-z0-9])${escRe(nk)}($|[^a-z0-9])`).test(s) : s.includes(nk);
        if (hit) score = Math.max(score, nk.length);
      }
    }
    if (score && a.group === ui.site) score += 0.5;     // empate: prefere a sede aberta na tela
    if (score > bestScore) { best = k; bestScore = score; }
  }
  return best;
}
function importExcelFile(file) {
  if (!needXLSX()) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const name = wb.SheetNames.find(n => ['base', 'alocacao', 'colaboradores'].includes(norm(n))) || wb.SheetNames[0];
      processImportRows(XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: '' }));
    } catch (err) { toast('Não foi possível ler a planilha: ' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}
function processImportRows(rows) {
  if (!rows.length) return toast('Planilha vazia');
  const hdr = rows.slice(0, 15).findIndex(r => r.some(c => /^(nome|funcionario|colaborador)/.test(norm(c))));
  let cName = 0, cRole = 1, cArea = 2, cSeat = -1, start = 0;
  if (hdr >= 0) {
    const h = rows[hdr].map(norm), find = re => h.findIndex(x => re.test(x));
    cName = find(/^(nome|funcionario|colaborador)/); cRole = find(/cargo|funcao/);
    cArea = find(/area|setor|lider|departamento|diretoria|gestor/);
    cSeat = find(/codigo/); if (cSeat < 0) cSeat = find(/assento/);
    start = hdr + 1;
  }
  const cell = (r, c) => (c >= 0 && r[c] != null ? String(r[c]).trim() : '');
  const existing = {}; for (const p of Object.values(state.people)) existing[norm(p.name) + '|' + p.area] = p.id;
  const res = { added: 0, dup: 0, noArea: 0, placed: 0 };
  snapshot();
  for (const r of rows.slice(start)) {
    const name = cell(r, cName);
    if (!name || norm(name) === 'total') continue;
    const rawArea = cell(r, cArea);
    let a = matchArea(rawArea);
    if (!a) { a = 'sem-area'; res.noArea++; }
    const key = norm(name) + '|' + a;
    let pid = existing[key];
    if (pid) res.dup++;
    else { pid = uid() + res.added; state.people[pid] = { id: pid, name, role: cell(r, cRole), area: a }; existing[key] = pid; res.added++; }
    const code = cell(r, cSeat);
    if (code && SEATS[code] && !seatOf(pid)) { state.assign[code] = pid; delete state.reserve[code]; res.placed++; }
  }
  if (!res.added && !res.placed) { undoStack.pop(); return openDialog({ title: 'Nada novo na planilha', body: `<p>Nenhuma pessoa nova foi encontrada${res.dup ? ` (${res.dup} já estavam cadastradas)` : ''}.</p>`, actions: [{ label: 'Ok', kind: 'primary', onClick: closeDialog }] }); }
  commit();
  openDialog({ title: 'Planilha importada', body: `<div class="import-sum">
      <div><span>Pessoas novas na lista</span><b>${res.added}</b></div>
      ${res.placed ? `<div><span>Já colocadas no lugar indicado</span><b>${res.placed}</b></div>` : ''}
      ${res.dup ? `<div><span>Já cadastradas (ignoradas)</span><b>${res.dup}</b></div>` : ''}
      ${res.noArea ? `<div><span>Sem área reconhecida → “Sem área definida”</span><b>${res.noArea}</b></div>` : ''}
    </div><p class="muted-txt" style="margin-top:10px">As pessoas sem lugar aparecem em “Não alocados”, no painel à esquerda.</p>`,
    actions: [{ label: 'Desfazer importação', onClick: () => { closeDialog(); undo(); } }, { label: 'Ok', kind: 'primary', onClick: closeDialog }] });
}
function exportBackup() {
  state.lastBackup = Date.now(); save();
  download(`Backup_Mapa_Assentos_Ambar_${dateStamp()}.json`, JSON.stringify({ app: 'mapa-assentos-ambar', version: 1, exportedAt: new Date().toISOString(), state }, null, 2), 'application/json');
  renderSaveStatus(); toast('Backup salvo na pasta de downloads');
}
function importJsonFile(file) {
  const reader = new FileReader();
  reader.onload = async e => {
    let data; try { data = JSON.parse(e.target.result); } catch (err) { return toast('Arquivo JSON inválido'); }
    if (Array.isArray(data)) return importLegacy(data);
    if (data && data.state && data.state.people) {
      if (!await confirmDialog('Restaurar backup', `Substituir o mapa atual pelo backup de ${data.exportedAt ? new Date(data.exportedAt).toLocaleString('pt-BR') : 'data desconhecida'}? (É possível desfazer.)`, 'Restaurar')) return;
      snapshot(); state = migrate(data.state); commit('Backup restaurado');
    } else toast('Arquivo não reconhecido');
  };
  reader.readAsText(file);
}
function importLegacy(arr) {   // JSON da versão anterior da Matriz (lista de colaboradores com seatId)
  snapshot(); let n = 0, placed = 0;
  arr.forEach(c => {
    if (!c || !c.name) return;
    const id = uid() + n;
    state.people[id] = { id, name: String(c.name), role: c.role ? String(c.role) : '', area: state.areas[c.dept] ? c.dept : 'sem-area' };
    n++;
    const m = /^seat-c(\d)-p(\d)-([lr])$/.exec(c.seatId || ''), d = /^seat-dir-(\d)-m$/.exec(c.seatId || '');
    const seat = m ? `mz-c${m[1]}-p${m[2]}-${m[3]}` : d ? `mz-d${d[1]}` : null;
    if (seat && SEATS[seat]) { state.assign[seat] = id; placed++; }
  });
  if (placed) { ui.floor = 'mz-holding'; ui.site = 'mz'; }
  commit(`${n} pessoas importadas do layout antigo (${placed} já com lugar)`);
}

/* =====================================================================
   IMPRESSÃO
   ===================================================================== */
function buildPrint(floorIds) {
  const pa = $('#printArea'); pa.innerHTML = '';
  const date = new Date().toLocaleDateString('pt-BR');
  for (const fid of floorIds) {
    const f = FLOORS[fid], st = floorStats(f);
    const page = el('section', 'print-page');
    page.innerHTML = `<div class="print-head"><div><p>${esc(f.site.full)}</p><h1>${esc(f.name)}</h1></div>
      <p class="r">${st.occ} de ${st.total} lugares ocupados · ${st.free} livres${st.res ? ` · ${st.res} reservados` : ''}<br>Emitido em ${date}</p></div>`;
    const scale = Math.min(1030 / (f.W + 8), 560 / (f.H + 8), 1);
    const wrap = el('div', 'print-plan'); wrap.style.width = (f.W + 8) * scale + 'px'; wrap.style.height = (f.H + 8) * scale + 'px';
    const inner = el('div', 'print-inner'); inner.style.transform = `scale(${scale})`; inner.append(buildPlan(f, false));
    wrap.append(inner); page.append(wrap);
    const keys = new Set(Object.keys(st.byArea)); f.items.forEach(it => it.segments?.forEach(s => keys.add(s.area)));
    page.append(el('div', 'print-legend', [...keys].filter(k => state.areas[k]).sort((a, b) => cmp(area(a).label, area(b).label))
      .map(k => `<span><i class="dot" style="--c:${area(k).color}"></i>${esc(area(k).label)} (${st.byArea[k] || 0})</span>`).join('')
      + `<span><i class="dot free"></i>Livre (${st.free})</span>` + (st.res ? `<span><i class="dot res"></i>Reservado (${st.res})</span>` : '')));
    pa.append(page);
  }
}
function printFloors(ids) { buildPrint(ids); setTimeout(() => window.print(), 50); }

/* =====================================================================
   TEMA
   ===================================================================== */
function applyTheme() {
  const dark = ui.theme === 'dark' || (ui.theme === 'auto' && window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
let drag = null;
function clearDragMarks() { $$('.dragging,.drop-over').forEach(x => x.classList.remove('dragging', 'drop-over')); }
const typing = e => /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;

const ACTIONS = {
  importExcel: () => $('#fileExcel').click(),
  importJson: () => $('#fileJson').click(),
  exportExcel, exportBackup,
  printFloor: () => printFloors([ui.floor]),
  printSite: () => printFloors(curSite().floors.map(f => f.id)),
  areas: openAreasDialog,
  theme: () => { ui.theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; applyTheme(); saveUI(); },
  help: openHelp,
  clearFloor: async () => {
    const f = curFloor();
    if (!await confirmDialog('Esvaziar andar', `Todas as pessoas de “${f.name}” voltarão para a lista de não alocados e as reservas serão removidas.`, 'Esvaziar', true)) return;
    snapshot(); f.seats.forEach(s => { delete state.assign[s.id]; delete state.reserve[s.id]; }); commit(`${f.name} esvaziado`);
  },
  reset: async () => {
    if (!await confirmDialog('Restaurar dados iniciais', 'O mapa volta à ocupação original do Bloco 6 e a Matriz fica vazia. Todo o resto será perdido (dá para desfazer enquanto a página estiver aberta).', 'Restaurar', true)) return;
    snapshot(); state = seedState(); commit('Dados iniciais restaurados');
  },
};

function bindEvents() {
  // Menus
  document.addEventListener('click', e => {
    const mb = e.target.closest('[data-menu]');
    const act = e.target.closest('[data-act]');
    $$('.menu-pop.open').forEach(m => { if (!mb || m.id !== mb.dataset.menu) m.classList.remove('open'); });
    if (mb) $('#' + mb.dataset.menu).classList.toggle('open');
    if (act && ACTIONS[act.dataset.act] && !act.closest('.person')) ACTIONS[act.dataset.act]();
    if (!e.target.closest('.search')) $('#results').classList.remove('open');
    if (window.innerWidth <= 920 && !e.target.closest('#sidebar') && !e.target.closest('#btnSidebar') && !e.target.closest('.modal')) $('#sidebar').classList.remove('open');
  });

  $('#siteSwitch').addEventListener('click', e => { const b = e.target.closest('[data-site]'); if (b && b.dataset.site !== ui.site) gotoFloor(SITES.find(s => s.id === b.dataset.site).floors[0].id); });
  $('#floorTabs').addEventListener('click', e => { const b = e.target.closest('[data-floor]'); if (b) gotoFloor(b.dataset.floor); });

  // Planta: clique, tooltip, arrastar
  const plan = $('#plan');
  plan.addEventListener('click', e => {
    const lab = e.target.closest('[data-label]');
    if (lab && !ui.placing) {
      const key = lab.dataset.label, def = lab.dataset.def;
      return textDialog('Renomear', getLabel(key, def), def, v => { snapshot(); if (v && v !== def) state.labels[key] = v; else delete state.labels[key]; commit('Nome atualizado'); },
        state.labels[key] ? { label: 'Voltar ao original', left: true, onClick: () => { closeDialog(); snapshot(); delete state.labels[key]; commit('Nome original restaurado'); } } : null);
    }
    const s = e.target.closest('.seat'); if (s) onSeatClick(s.dataset.seat);
  });
  plan.addEventListener('mouseover', e => { const s = e.target.closest('.seat'); if (s && !drag) showTip(s); });
  plan.addEventListener('mouseout', e => { const s = e.target.closest('.seat'); if (s && !s.contains(e.relatedTarget)) hideTip(); });
  plan.addEventListener('dragstart', e => {
    const s = e.target.closest('.seat.occ'); if (!s) return;
    drag = { kind: 'seat', id: s.dataset.seat };
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', s.dataset.seat);
    s.classList.add('dragging'); hideTip();
  });
  plan.addEventListener('dragover', e => {
    const s = e.target.closest('.seat'); if (!s || !drag) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    if (!s.classList.contains('drop-over')) { $$('#plan .drop-over').forEach(x => x.classList.remove('drop-over')); s.classList.add('drop-over'); }
  });
  plan.addEventListener('dragleave', e => { const s = e.target.closest('.seat'); if (s && !s.contains(e.relatedTarget)) s.classList.remove('drop-over'); });
  plan.addEventListener('drop', e => {
    const s = e.target.closest('.seat'); if (!s || !drag) return;
    e.preventDefault(); const d = drag; drag = null; clearDragMarks();
    if (d.kind === 'person') placePerson(d.id, s.dataset.seat);
    else if (d.kind === 'seat' && d.id !== s.dataset.seat && state.assign[d.id]) placePerson(state.assign[d.id], s.dataset.seat);
  });
  document.addEventListener('dragend', () => { drag = null; clearDragMarks(); });

  // Lista de não alocados
  const pool = $('#poolList');
  pool.addEventListener('dragstart', e => { const p = e.target.closest('.person'); if (!p) return; drag = { kind: 'person', id: p.dataset.pid }; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', p.dataset.pid); p.classList.add('dragging'); });
  pool.addEventListener('dragover', e => { if (drag && drag.kind === 'seat') { e.preventDefault(); pool.classList.add('drop-over'); } });
  pool.addEventListener('dragleave', e => { if (!pool.contains(e.relatedTarget)) pool.classList.remove('drop-over'); });
  pool.addEventListener('drop', e => { pool.classList.remove('drop-over'); if (drag && drag.kind === 'seat') { e.preventDefault(); const id = drag.id; drag = null; unassignSeat(id); } });
  pool.addEventListener('click', e => {
    const p = e.target.closest('.person'); if (!p) return;
    const act = e.target.closest('[data-act]')?.dataset.act, pid = p.dataset.pid;
    if (act === 'edit') return openPersonDialog(pid);
    if (act === 'del') return confirmDialog('Excluir pessoa', `Remover ${state.people[pid].name} do cadastro?`, 'Excluir', true).then(ok => ok && deletePerson(pid));
    if (ui.placing === pid) stopPlacing(); else startPlacing(pid);
  });
  pool.addEventListener('dblclick', e => { const p = e.target.closest('.person'); if (p) { stopPlacing(); openPersonDialog(p.dataset.pid); } });
  $('#poolSearch').addEventListener('input', e => { ui.poolSearch = e.target.value; renderPool(); });
  $('#poolArea').addEventListener('change', e => { ui.poolArea = e.target.value; renderPool(); });

  // Destaque por área (legenda e lista lateral)
  const focus = k => { ui.focusArea = ui.focusArea === k ? null : k; renderLegend(); applyHighlights(); };
  $('#legend').addEventListener('click', e => { const b = e.target.closest('[data-area]'); if (b) focus(b.dataset.area); });
  $('#areaList').addEventListener('click', e => { const b = e.target.closest('[data-area]'); if (b) focus(b.dataset.area); });

  // Adicionar pessoa
  const form = $('#addForm');
  $('#btnAddPerson').addEventListener('click', () => {
    form.hidden = !form.hidden;
    if (!form.hidden) { $('#addArea').innerHTML = areaOptions(ui.lastArea && state.areas[ui.lastArea] ? ui.lastArea : null, ui.site); $('#addName').focus(); }
  });
  $('#addCancel').addEventListener('click', () => { form.hidden = true; });
  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = $('#addName').value.trim(); if (!name) return;
    createPerson({ name, role: $('#addRole').value.trim(), area: $('#addArea').value });
    $('#addName').value = ''; $('#addRole').value = ''; $('#addName').focus();
  });

  // Busca
  const search = $('#search');
  search.addEventListener('input', () => { ui.search = search.value; resultIdx = 0; renderResults(); applyHighlights(); $('#searchKbd').hidden = !!search.value; });
  search.addEventListener('focus', () => { if (search.value) renderResults(); });
  search.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); resultIdx = Math.max(0, Math.min(resultItems.length - 1, resultIdx + (e.key === 'ArrowDown' ? 1 : -1))); renderResults(); $('#results .active')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); pickResult(resultIdx); }
  });
  $('#results').addEventListener('click', e => { const r = e.target.closest('.result'); if (r) pickResult(+r.dataset.i); });

  // Zoom
  $('#zoomIn').onclick = () => setZoom(ui.z + 0.1);
  $('#zoomOut').onclick = () => setZoom(ui.z - 0.1);
  $('#zoomFit').onclick = () => { ui.zoom = 'fit'; applyZoom(); };
  $('#stage').addEventListener('wheel', e => { if (e.ctrlKey || e.metaKey) { e.preventDefault(); setZoom(ui.z * (e.deltaY < 0 ? 1.1 : 0.9)); } }, { passive: false });
  $('#stage').addEventListener('scroll', hideTip, { passive: true });
  window.addEventListener('resize', () => { if (ui.zoom === 'fit') applyZoom(); });

  // Outros
  $('#btnUndo').onclick = undo;
  $('#placingCancel').onclick = stopPlacing;
  $('#btnSidebar').onclick = () => $('#sidebar').classList.toggle('open');
  $('#dlgClose').onclick = closeDialog;
  $('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeDialog(); });
  $('#fileExcel').addEventListener('change', e => { const f = e.target.files[0]; if (f) importExcelFile(f); e.target.value = ''; });
  $('#fileJson').addEventListener('change', e => { const f = e.target.files[0]; if (f) importJsonFile(f); e.target.value = ''; });
  window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
  window.addEventListener('beforeprint', () => { if (!$('#printArea').childElementCount) buildPrint([ui.floor]); });
  window.addEventListener('afterprint', () => { $('#printArea').innerHTML = ''; });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('#modal').hidden) return closeDialog();
      if (ui.placing) return stopPlacing();
      $$('.menu-pop.open').forEach(m => m.classList.remove('open'));
      if (document.activeElement === search || ui.search) { search.value = ''; ui.search = ''; renderResults(); applyHighlights(); search.blur(); $('#searchKbd').hidden = false; }
      if (ui.focusArea) { ui.focusArea = null; renderLegend(); applyHighlights(); }
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !typing(e) && $('#modal').hidden) { e.preventDefault(); undo(); return; }
    if (e.key === '/' && !typing(e) && $('#modal').hidden) { e.preventDefault(); search.focus(); search.select(); }
  });
}

/* =====================================================================
   INÍCIO
   ===================================================================== */
indexLayout();
state = loadState();
loadUI();
applyTheme();
hydrateIcons();
bindEvents();
render();
save();
</script>
