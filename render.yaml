# Blueprint do Render (render.com → New → Blueprint → este repositório).
# Plano Starter + disco persistente: os dados (colaboradores, PDFs, notas e certificados)
# sobrevivem a reinícios e novos deploys. O Render faz snapshot diário do disco.
services:
  - type: web
    name: trilha-dho-ambar
    runtime: node
    plan: starter
    region: virginia
    branch: claude/employee-training-platform-tfxumv
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
