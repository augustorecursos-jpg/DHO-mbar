<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minha Trilha · Âmbar Energia</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="app colaborador">
  <aside class="lateral" id="lateral">
    <a class="lateral-marca logo claro" href="index.html"><b>Âmbar</b><small>ENERGIA</small></a>
    <p class="lateral-grupo">INÍCIO</p>
    <button class="lateral-item ativo" data-rota="painel"><span class="ic">⌂</span>Meu painel</button>
    <p class="lateral-grupo">TEMAS DA TRILHA</p>
    <nav id="lista-modulos" aria-label="Temas da trilha"></nav>
    <div class="lateral-rodape">
      <a class="lateral-item" href="guia/guia-de-acesso.pdf" target="_blank" rel="noopener"><span class="ic">📘</span>Guia de acesso</a>
      <button class="lateral-item" id="sair"><span class="ic">⎋</span>Sair</button>
    </div>
  </aside>

  <div class="principal">
    <header class="barra">
      <button class="btn-menu" id="btn-menu" aria-label="Abrir menu">☰</button>
      <div class="barra-titulo">
        <small>TRILHA DE DESENVOLVIMENTO · DHO</small>
        <strong id="titulo-barra">Meu painel</strong>
      </div>
      <div class="barra-usuario">
        <span class="barra-nome"><strong id="nome-usuario">…</strong><small id="cargo-usuario"></small></span>
        <span class="avatar" id="avatar">–</span>
      </div>
    </header>

    <main class="conteudo" id="conteudo" tabindex="-1">
      <p class="carregando">Carregando sua trilha…</p>
    </main>
  </div>

  <!-- Visualizador do material (PDF) -->
  <dialog class="modal modal-pdf" id="modal-aula">
    <header>
      <h3 id="aula-titulo">Material</h3>
      <span class="aula-pagina" id="aula-pagina" aria-live="polite"></span>
      <div class="modal-acoes">
        <button class="btn btn-laranja btn-sm" id="aula-concluir">✓ Concluí este material</button>
        <button class="btn btn-claro btn-sm" data-fechar aria-label="Fechar">✕</button>
      </div>
    </header>
    <!-- PDF desenhado pelo pdf.js; impressão, menu de contexto e captura bloqueados. -->
    <div class="visualizador protegido" id="aula-paginas" tabindex="0" aria-label="Páginas do material"></div>
    <div class="aviso-protecao" id="aviso-protecao" hidden>
      <strong>🔒 Conteúdo protegido</strong>
      <span>Volte para esta janela para continuar a leitura.</span>
    </div>
  </dialog>
  <div class="bloqueio-impressao" aria-hidden="true">A impressão dos materiais da trilha não é permitida.</div>

  <!-- Avaliação -->
  <dialog class="modal modal-prova" id="modal-prova">
    <form id="form-prova" method="dialog">
      <header>
        <div><small>AVALIAÇÃO DO TEMA</small><h3 id="prova-titulo">Avaliação</h3></div>
        <button type="button" class="btn btn-claro btn-sm" data-fechar aria-label="Fechar">✕</button>
      </header>
      <div class="prova-corpo" id="prova-corpo"></div>
      <footer id="prova-rodape">
        <span id="prova-info"></span>
        <button class="btn btn-laranja" type="submit" id="prova-enviar">Enviar respostas</button>
      </footer>
    </form>
  </dialog>

  <script src="js/comum.js"></script>
  <script src="js/reacao-form.js"></script>
  <script src="js/trilha.js"></script>
</body>
</html>
